name: Android CI

on:
  push:
    branches:
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # Checkout code
      - name: Checkout code
        uses: actions/checkout@v3

      # Set up JDK 11
      - name: Set up JDK 11
        uses: actions/setup-java@v3
        with:
          distribution: 'adopt'
          java-version: '11'

      # Build with Gradle
      - name: Build with Gradle
        run: ./gradlew assembleRelease

      # Update version and commit
      - name: Update version and commit
        run: |
          APP_VER_NAME=$(date -u '+%y.%m.%d')
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          echo "appVerName=$APP_VER_NAME" > gradle.properties
          git add gradle.properties
          git commit -m "Update version to $APP_VER_NAME"
          git tag -a "$APP_VER_NAME" -m "Version $APP_VER_NAME"
          git push origin master --tags
        env:
          GH_PAT: ${{ secrets.GH_PAT }}

      # Create GitHub Release
      - name: Create GitHub Release
        uses: actions/create-release@v1
        with:
          tag_name: ${{ env.APP_VER_NAME }}
          release_name: "Release ${{ env.APP_VER_NAME }}"
          body: "Automatically generated release for version ${{ env.APP_VER_NAME }}"
          draft: false
          prerelease: false
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
